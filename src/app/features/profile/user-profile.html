<section class="page">
  @if (profile(); as user) {
    <div class="hero">
      <div class="avatar">{{ user.username.charAt(0) }}</div>
      <div>
        <p class="kicker">Player</p>
        <h1>{{ user.username }}</h1>
        <p class="bio">{{ user.bio || 'This chili has not written a bio yet.' }}</p>
        <p class="meta">Joined {{ user.created_at | date: 'mediumDate' }}</p>
      </div>
    </div>
  }
</section>
