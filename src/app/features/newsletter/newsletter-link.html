<section uiPage="form" class="auth">
  <p class="kicker">Newsletter</p>
  <h1>{{ copy.title }}</h1>
  @if (busy()) {
    <p uiNotice>{{ copy.busy }}</p>
  }
  @if (message()) {
    <p uiNotice="success">{{ message() }}</p>
  }
  @if (error()) {
    <p uiNotice="error">{{ error() }}</p>
  }
  <p class="switch"><a routerLink="/">Back to Chili Platform</a></p>
</section>
