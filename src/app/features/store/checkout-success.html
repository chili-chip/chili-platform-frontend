<section uiPage="narrow">
  <p class="kicker">Checkout</p>

  @if (loading()) {
    <h1>Confirming payment</h1>
    <p class="lede" role="status">
      <app-spinner /> Confirming your payment…
    </p>
  } @else if (error()) {
    <h1>We could not confirm your payment</h1>
    <p uiNotice="error" class="lede">{{ error() }}</p>
    <a uiButton="ghost" routerLink="/store">Back to store</a>
  }
</section>
