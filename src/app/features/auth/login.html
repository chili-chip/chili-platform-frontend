<section class="auth">
  <p class="kicker">Account</p>
  <h1>Sign in</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Username
      <input formControlName="username" autocomplete="username" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (error()) {
      <p class="err">{{ error() }}</p>
    }
    <button class="btn primary" type="submit">Enter</button>
  </form>
  <p class="switch"><a routerLink="/forgot-password">Forgot password?</a></p>
  <p class="switch">New here? <a routerLink="/register" [queryParams]="next ? { next } : {}">Create an account</a></p>
</section>
