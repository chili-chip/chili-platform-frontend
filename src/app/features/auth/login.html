<section uiPage="form" class="auth">
  <p class="kicker">Account</p>
  <h1>Sign in</h1>
  <form class="ui-stack" [formGroup]="form" (ngSubmit)="submit()">
    <label uiField>
      Username
      <input uiInput formControlName="username" autocomplete="username" />
    </label>
    <label uiField>
      Password
      <input uiInput type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (error()) {
      <p uiNotice="error">{{ error() }}</p>
    }
    <button uiButton type="submit">Sign in</button>
  </form>
  <app-social-login [next]="next" />
  <p class="switch"><a routerLink="/forgot-password">Forgot password?</a></p>
  <p class="switch">New here? <a routerLink="/register" [queryParams]="next ? { next } : {}">Create an account</a></p>
</section>
