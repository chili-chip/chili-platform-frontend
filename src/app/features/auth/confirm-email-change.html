<section uiPage="form" class="auth">
  <p class="kicker">Account</p>
  <h1>Confirm new email</h1>
  @if (busy()) {
    <p uiNotice>Confirming…</p>
  }
  @if (message()) {
    <p uiNotice="success">{{ message() }}</p>
  }
  @if (error()) {
    <p uiNotice="error">{{ error() }}</p>
  }
  <p class="switch"><a routerLink="/settings">Back to settings</a></p>
</section>
