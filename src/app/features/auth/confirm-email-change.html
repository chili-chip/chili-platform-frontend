<section class="auth">
  <p class="kicker">Account</p>
  <h1>Confirm new email</h1>
  @if (busy()) {
    <p class="note">Confirming…</p>
  }
  @if (message()) {
    <p>{{ message() }}</p>
  }
  @if (error()) {
    <p class="err">{{ error() }}</p>
  }
  <p class="switch"><a routerLink="/settings">Back to settings</a></p>
</section>
