<section uiPage="form" class="auth">
  <p class="kicker">Account</p>
  <h1>Create your account</h1>
  <form class="ui-stack" [formGroup]="form" (ngSubmit)="submit()">
    <label uiField>
      Username
      <input uiInput formControlName="username" autocomplete="username" />
    </label>
    <label uiField>
      Email
      <input uiInput type="email" formControlName="email" autocomplete="email" />
    </label>
    <label uiField>
      Password
      <input uiInput type="password" formControlName="password" autocomplete="new-password" />
    </label>
    <label uiField>
      Bio
      <textarea uiInput formControlName="bio" rows="3"></textarea>
    </label>
    <label uiChoice>
      <input uiCheck type="checkbox" formControlName="acceptTerms" />
      <span>
        I am able to enter a contract, and I agree to the
        <a routerLink="/terms" (click)="$event.stopPropagation()">terms of service</a>
        and the
        <a routerLink="/privacy" (click)="$event.stopPropagation()">privacy policy</a>.
      </span>
    </label>
    @if (error()) {
      <p uiNotice="error">{{ error() }}</p>
    }
    <button uiButton type="submit">Create account</button>
  </form>
  <app-social-login [acceptTerms]="termsAccepted()" [next]="next" (termsRequired)="requireTerms()" />
  <p class="switch">Already have an account? <a routerLink="/login" [queryParams]="next ? { next } : {}">Sign in</a></p>
  <p class="switch"><a routerLink="/verify-email">Resend verification email</a></p>
</section>
