<section class="auth">
  <p class="kicker">Account</p>
  <h1>Join the scene</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Username
      <input formControlName="username" autocomplete="username" />
    </label>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>
    <label>
      Bio
      <textarea formControlName="bio" rows="3"></textarea>
    </label>
    <label class="checks">
      <input type="checkbox" formControlName="acceptTerms" />
      <span>
        I am able to enter a contract, and I agree to the
        <a routerLink="/terms" (click)="$event.stopPropagation()">terms of service</a>
        and the
        <a routerLink="/privacy" (click)="$event.stopPropagation()">privacy policy</a>.
      </span>
    </label>
    @if (error()) {
      <p class="err">{{ error() }}</p>
    }
    <button class="btn primary" type="submit">Create account</button>
  </form>
  <p class="switch">Already playing? <a routerLink="/login" [queryParams]="next ? { next } : {}">Sign in</a></p>
  <p class="switch"><a routerLink="/verify-email">Verify an email</a></p>
</section>
