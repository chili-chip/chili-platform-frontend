<section uiPage="form" class="auth">
  <p class="kicker">Account</p>
  <h1>Verify email</h1>
  @if (message()) {
    <p uiNotice="success">{{ message() }}</p>
  } @else {
    <p uiNotice>Open the link in your email, or send another one if you are signed in.</p>
  }
  @if (error()) {
    <p uiNotice="error">{{ error() }}</p>
  }
  @if (auth.isAuthenticated() && auth.currentUser()?.email_verified !== true) {
    <button uiButton type="button" (click)="resend()" [disabled]="busy()">
      Send a new link
    </button>
  }
  <p class="switch"><a routerLink="/login">Sign in</a></p>
</section>
