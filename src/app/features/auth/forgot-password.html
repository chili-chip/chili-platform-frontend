<section uiPage="form" class="auth">
  <p class="kicker">Account</p>
  <h1>Forgot password</h1>
  <form class="ui-stack" [formGroup]="form" (ngSubmit)="submit()">
    <label uiField>
      Email
      <input uiInput type="email" formControlName="email" autocomplete="email" />
    </label>
    @if (message()) {
      <p uiNotice="success">{{ message() }}</p>
    }
    @if (error()) {
      <p uiNotice="error">{{ error() }}</p>
    }
    <button uiButton type="submit">Send reset link</button>
  </form>
  <p class="switch"><a routerLink="/login">Back to sign in</a></p>
</section>
