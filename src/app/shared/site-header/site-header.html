<header class="nav">
  <a routerLink="/" class="brand">
    <span class="brand__mark" aria-hidden="true"></span>
    <span class="brand__word">chili</span>
    <span class="brand__sub">platform</span>
  </a>

  <nav class="links" aria-label="Primary">
    <a routerLink="/store" routerLinkActive="is-active">Store</a>
    <a routerLink="/marketplace" routerLinkActive="is-active">Marketplace</a>
    <a routerLink="/creator" routerLinkActive="is-active">Creator</a>
    <a routerLink="/community" routerLinkActive="is-active">Community</a>
  </nav>

  <div class="session">
    @if (auth.isAuthenticated()) {
      <a class="ghost" [routerLink]="['/profile', auth.currentUser()?.username ?? 'me']">
        {{ auth.currentUser()?.username ?? 'profile' }}
      </a>
      <button type="button" class="ghost" (click)="auth.logout()">Sign out</button>
    } @else {
      <a routerLink="/login">Sign in</a>
      <a routerLink="/register" class="cta">Join</a>
    }
  </div>
</header>
