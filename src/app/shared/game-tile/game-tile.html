@if (link(); as dest) {
  <a class="face" [routerLink]="dest">
    <ng-container [ngTemplateOutlet]="face" />
  </a>
} @else {
  <div class="face">
    <ng-container [ngTemplateOutlet]="face" />
  </div>
}

<ng-template #face>
  <ui-cover [src]="cover()" [alt]="title()" />
  <div class="body">
    @if (meta() || badge()) {
      <div class="meta">
        <span>{{ meta() }}</span>
        @if (badge()) {
          <span uiBadge="success">{{ badge() }}</span>
        }
      </div>
    }
    <h2>{{ title() }}</h2>
    @if (detail()) {
      <p class="muted">{{ detail() }}</p>
    }
    @if (ratingCount() !== null) {
      <p class="rating">{{ ratingLine() }}</p>
    }
    @if (foot()) {
      <strong class="foot">{{ foot() }}</strong>
    }
  </div>
</ng-template>
