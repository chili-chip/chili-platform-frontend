<form class="signup" [formGroup]="form" (ngSubmit)="submit()">
  <label for="newsletter-email">Subscribe to our newsletter for game, hardware, and platform news</label>
  <div class="ui-input-group">
    <input
      id="newsletter-email"
      type="email"
      formControlName="email"
      uiInput
      size="sm"
      autocomplete="email"
      placeholder="you@example.com"
    />
    <button uiButton="ghost" size="sm" type="submit" [disabled]="busy()">Subscribe</button>
  </div>
  @if (message()) {
    <p uiNotice="success" role="status">{{ message() }}</p>
  }
  @if (error()) {
    <p uiNotice="error" role="alert">{{ error() }}</p>
  }
</form>
