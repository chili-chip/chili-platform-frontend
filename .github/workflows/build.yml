# Build and test on every pull request and on pushes to dev and main.
# A push to dev deploys the dev build to the chili-platform-dev Pages project;
# a push to main deploys the production build to chili-platform.
name: Build

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [production, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration ${{ matrix.configuration }}
      # Keep the build that matches the pushed branch for the deploy job.
      - if: >-
          github.event_name == 'push' &&
          ((github.ref_name == 'dev' && matrix.configuration == 'dev') ||
           (github.ref_name == 'main' && matrix.configuration == 'production'))
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/chili-platform/browser

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:styles
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  deploy:
    if: github.event_name == 'push'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://platform.chilichip.eu' || 'https://platform-dev.chilichip.eu' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name=${{ github.ref_name == 'main' && 'chili-platform' || 'chili-platform-dev' }}
          --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
