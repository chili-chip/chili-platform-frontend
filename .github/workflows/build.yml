# Build and test on every pull request and on pushes to dev and main.
# A push to dev also deploys the dev build to the chili-platform-dev Pages
# project. Production (main) is deployed by the Pages git integration on the
# chili-platform project, so this workflow only builds it.
name: Build

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [production, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration ${{ matrix.configuration }}
      - if: matrix.configuration == 'dev' && github.event_name == 'push' && github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: dev-build
          path: dist/chili-platform/browser

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  deploy-dev:
    if: github.event_name == 'push' && github.ref_name == 'dev'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://platform-dev.chilichip.eu
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dev-build
          path: dist
      - run: npx --yes wrangler@4 pages deploy dist --project-name=chili-platform-dev --branch=dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
